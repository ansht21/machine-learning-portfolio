version: "3.8"

services:
  retention-api:
    build: .
    container_name: subscription_retention_api
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GENAI_MODEL=${GENAI_MODEL:-openai/gpt-oss-120b}
      - ENV=production
    volumes:
      - chroma_data:/app/models/churn_rag_db
      - hf_cache:/app/hf_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  retention-dashboard:
    image: python:3.10-slim
    container_name: subscription_retention_ui
    ports:
      - "8501:8501"
    depends_on:
      retention-api:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app:ro
    environment:
      - API_SERVER_URL=http://retention-api:8000
    command: >
      sh -c "pip install --no-cache-dir -r requirements-ui.txt &&
             streamlit run app/frontend.py --server.port=8501 --server.address=0.0.0.0"
    restart: unless-stopped

volumes:
  chroma_data:
  hf_cache:
